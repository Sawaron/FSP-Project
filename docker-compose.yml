services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: technofest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d technofest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: