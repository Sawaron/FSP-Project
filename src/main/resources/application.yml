server:
  port: ${SERVER_PORT:8082}

spring:
  profiles:
    active: local
  application:
    name: FSP-Project
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    baseline-on-migrate: false

jwt:
