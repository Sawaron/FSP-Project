spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/technofest}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

app:
  local-organizer:
    enabled: ${LOCAL_ORGANIZER_ENABLED:false}
    email: ${LOCAL_ORGANIZER_EMAIL:organizer@example.com}
    password: ${LOCAL_ORGANIZER_PASSWORD:}