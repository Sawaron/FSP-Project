spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/technofest}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:314159265358979323846}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true